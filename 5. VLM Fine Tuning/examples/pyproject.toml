dependencies = [
    "accelerate>=1.2.0",
    "bitsandbytes>=0.45.0",
    "datasets>=3.2.0",
    "huggingface-hub>=0.26.0",
    "ipykernel>=7.3.0",
    "python-dotenv>=1.0.0",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.10.0",
    "ollama>=0.6.2",
    "peft>=0.14.0",
    "pillow>=12.3.0",
